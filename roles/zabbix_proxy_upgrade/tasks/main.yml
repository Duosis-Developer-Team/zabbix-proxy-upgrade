---
# ── PHASE 1: BACKUP + DATA DIR DETECTION ─────────────────────────────────────

- name: "[1/10] Backup zabbix_proxy.conf"
  copy:
    src: /etc/zabbix/zabbix_proxy.conf
    dest: /etc/zabbix/zabbix_proxy.conf.backup
    remote_src: true
    force: false

- name: "[1/10] Backup zabbix_agent2.conf"
  copy:
    src: /etc/zabbix/zabbix_agent2.conf
    dest: /etc/zabbix/zabbix_agent2.conf.backup
    remote_src: true
    force: false

- name: "[1/10] Backup postgresql.conf"
  copy:
    src: "/etc/postgresql/{{ postgres_old_version }}/main/postgresql.conf"
    dest: /tmp/postgresql_old.conf.backup
    remote_src: true
    force: false

- name: "[1/10] Detect old PostgreSQL data directory"
  shell: |
    grep -E "^data_directory\s*=" /etc/postgresql/{{ postgres_old_version }}/main/postgresql.conf \
      | sed "s/.*=\s*'//;s/'.*$//" \
      | xargs
  register: pg_old_data_dir_raw
  changed_when: false
  failed_when: false

- name: "[1/10] Calculate new PostgreSQL data directory"
  set_fact:
    pg_new_data_dir: >-
      {{
        (pg_old_data_dir_raw.stdout | trim)
        | replace(
            '/postgresql/' + postgres_old_version | string + '/',
            '/postgresql/' + postgres_version | string + '/'
          )
        if (pg_old_data_dir_raw.stdout | trim) != ''
        else '/var/lib/postgresql/' + postgres_version | string + '/main'
      }}

- name: "[1/10] Show detected data directory"
  debug:
    msg: "Old: {{ pg_old_data_dir_raw.stdout | trim }} → New: {{ pg_new_data_dir }}"

# ── PHASE 2: APT SOURCES CLEANUP + UPDATE ────────────────────────────────────

- name: "[2/10] Clean invalid and duplicate apt sources"
  shell: |
    sed -i '/apt\.postgresql\.org.*bullseye/d' /etc/apt/sources.list
    find /etc/apt/sources.list.d/ -name "*.list" | xargs -r grep -l "bullseye-pgdg" | xargs -r rm -f
    awk '!seen[$0]++' /etc/apt/sources.list > /tmp/sources.list.clean
    mv /tmp/sources.list.clean /etc/apt/sources.list
  changed_when: true

- name: "[2/10] apt update"
  shell: apt-get update 2>&1
  register: apt_update_result
  changed_when: false
  failed_when:
    - apt_update_result.rc != 0
    - "'Err:' in apt_update_result.stdout"

- name: "[2/10] Install PostgreSQL {{ postgres_version }}"
  apt:
    name: "postgresql-{{ postgres_version }}"
    state: present

# ── PHASE 3: ZABBIX 7.0 UPGRADE ──────────────────────────────────────────────

- name: "[3/10] Download Zabbix 7.0 release package"
  get_url:
    url: "{{ zabbix_release_url }}"
    dest: "/tmp/{{ zabbix_release_deb }}"
    mode: '0644'
    force: true

- name: "[3/10] Install Zabbix 7.0 release package"
  apt:
    deb: "/tmp/{{ zabbix_release_deb }}"

- name: "[3/10] apt update after new repo"
  apt:
    update_cache: true
    cache_valid_time: 0

- name: "[3/10] Upgrade zabbix-proxy-pgsql and zabbix-sql-scripts"
  apt:
    name:
      - zabbix-proxy-pgsql
      - zabbix-sql-scripts
    state: latest
    only_upgrade: true

# ── PHASE 4: REMOVE POSTGRESQL OLD VERSION ───────────────────────────────────

- name: "[4/10] Stop and disable PostgreSQL {{ postgres_old_version }}"
  shell: |
    systemctl stop postgresql@{{ postgres_old_version }}-main 2>/dev/null || true
    systemctl stop postgresql 2>/dev/null || true
    systemctl disable postgresql@{{ postgres_old_version }}-main 2>/dev/null || true
    pkill -u postgres || true
    sleep 2
  changed_when: true

- name: "[4/10] Remove PostgreSQL {{ postgres_old_version }}"
  apt:
    name:
      - "postgresql-{{ postgres_old_version }}"
      - "postgresql-client-{{ postgres_old_version }}"
    state: absent
    purge: true
  ignore_errors: true

- name: "[4/10] apt autoremove"
  apt:
    autoremove: true
    purge: true

- name: "[4/10] Verify port 5432 is free"
  shell: ss -tlnp | grep ':5432' || echo "free"
  register: port_check
  changed_when: false

- name: "[4/10] Port 5432 status"
  debug:
    msg: "{{ port_check.stdout }}"

# ── PHASE 5: POSTGRESQL 16 CLUSTER SETUP ─────────────────────────────────────

- name: "[5/10] Create data directory if custom path"
  file:
    path: "{{ pg_new_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'
  when: "'/var/lib/postgresql/' not in pg_new_data_dir"

- name: "[5/10] Fix custom data directory ownership"
  file:
    path: "{{ pg_new_data_dir | dirname }}"
    state: directory
    owner: postgres
    group: postgres
    recurse: true
  when: "'/var/lib/postgresql/' not in pg_new_data_dir"

- name: "[5/10] Stop any auto-created pg{{ postgres_version }} cluster"
  shell: "pg_ctlcluster {{ postgres_version }} main stop 2>/dev/null || true"
  changed_when: false

- name: "[5/10] Drop auto-created pg{{ postgres_version }} cluster"
  shell: "pg_dropcluster {{ postgres_version }} main 2>/dev/null || true"
  changed_when: false

- name: "[5/10] Create PostgreSQL {{ postgres_version }} cluster"
  shell: "pg_createcluster {{ postgres_version }} main -d {{ pg_new_data_dir }}"

# ── PHASE 6: DEPLOY CONFIG FILES ─────────────────────────────────────────────

- name: "[6/10] Copy config generator script"
  copy:
    src: generate_configs.py
    dest: /tmp/generate_configs.py
    mode: '0755'

- name: "[6/10] Generate and deploy all config files"
  shell: >
    python3 /tmp/generate_configs.py
    /etc/zabbix/zabbix_proxy.conf.backup
    /etc/zabbix/zabbix_agent2.conf.backup
    /tmp/postgresql_old.conf.backup
  environment:
    ZABBIX_DB_PASSWORD: "{{ zabbix_db_password }}"
    ZABBIX_SERVER_IPS: "{{ zabbix_server_ips }}"
    POSTGRES_VERSION: "{{ postgres_version }}"
    POSTGRES_DATA_DIR: "{{ pg_new_data_dir }}"
  register: config_result
  notify:
    - restart zabbix-proxy
    - restart zabbix-agent2

- name: "[6/10] Show migrated config values"
  debug:
    msg: "{{ config_result.stdout | from_json }}"

- name: "[6/10] Remove generator script from host"
  file:
    path: /tmp/generate_configs.py
    state: absent

# ── PHASE 7: START POSTGRESQL ─────────────────────────────────────────────────

- name: "[7/10] Start PostgreSQL {{ postgres_version }}"
  systemd:
    name: "postgresql@{{ postgres_version }}-main"
    state: started
    enabled: true

- name: "[7/10] Enable postgresql umbrella service"
  systemd:
    name: postgresql
    enabled: true

- name: "[7/10] Wait for PostgreSQL socket"
  wait_for:
    path: /var/run/postgresql/.s.PGSQL.5432
    timeout: 30
    msg: "PostgreSQL did not start in 30 seconds"

# ── PHASE 8: DATABASE SETUP ───────────────────────────────────────────────────

- name: "[8/10] Create zabbix user and set password"
  shell: |
    if sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='zabbix'" | grep -q 1; then
      sudo -u postgres psql -c "ALTER USER zabbix WITH PASSWORD '$DB_PASS';"
    else
      sudo -u postgres psql -c "CREATE USER zabbix WITH PASSWORD '$DB_PASS';"
    fi
  environment:
    DB_PASS: "{{ zabbix_db_password }}"
  changed_when: true

- name: "[8/10] Create zabbix_proxy database"
  shell: |
    sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='zabbix_proxy'" | grep -q 1 \
      || sudo -u postgres createdb -O zabbix zabbix_proxy
  changed_when: true

# ── PHASE 9: SCHEMA ───────────────────────────────────────────────────────────

- name: "[9/10] Check if schema is already loaded"
  shell: sudo -u postgres psql -d zabbix_proxy -tAc "SELECT to_regclass('public.hosts') IS NOT NULL"
  register: schema_check
  changed_when: false

- name: "[9/10] Load proxy SQL schema"
  shell: cat /usr/share/zabbix-sql-scripts/postgresql/proxy.sql | sudo -u zabbix psql zabbix_proxy
  when: schema_check.stdout | trim != 't'

# ── PHASE 10: SERVICES + VERIFY ───────────────────────────────────────────────

- name: "[10/10] Enable all services"
  systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - postgresql
    - zabbix-proxy
    - zabbix-agent2

- name: "[10/10] Flush handlers"
  meta: flush_handlers

- name: "[10/10] Verify services are active"
  shell: systemctl is-active {{ item }}
  register: svc_status
  changed_when: false
  failed_when: svc_status.stdout != 'active'
  loop:
    - postgresql
    - zabbix-proxy
    - zabbix-agent2

- name: "[10/10] Show Zabbix proxy version"
  shell: zabbix_proxy -V 2>&1 | head -1
  register: zabbix_version_out
  changed_when: false

- name: "[10/10] Version"
  debug:
    msg: "{{ zabbix_version_out.stdout }}"
